name: Verify package

# Everything a change has to pass, and everything a release has to pass before it is published.
# CI runs it on every push and pull request with the project file's version; the publish workflow
# runs it with the version from the release tag, and publishes the package it uploads.
on:
  workflow_call:
    inputs:
      package-version:
        description: The version for the NuGet package. Empty uses the project file's.
        type: string
        default: ""
      release-tag:
        description: The GitHub Release tag the NuGet release notes link to.
        type: string
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    name: .NET (Umbraco ${{ matrix.umbraco-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, and the newest of each major, since the package declares a range.
        umbraco-version:
          - 17.1.0
          - 17.*
          - 18.*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # TreatWarningsAsErrors is on for every project, so this is the warning gate too.
      - name: Test
        run: >-
          dotnet test tests/TheBuilder.DeliveryApiOidc.Tests/TheBuilder.DeliveryApiOidc.Tests.csproj
          --configuration Release
          '-p:UmbracoVersion=${{ matrix.umbraco-version }}'

  package:
    name: Sample and package
    runs-on: ubuntu-latest
    needs: dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build sample
        run: dotnet build samples/TheBuilder.DeliveryApiOidc.Example/TheBuilder.DeliveryApiOidc.Example.csproj --configuration Release

      # The project file holds the only local version, so CI reads it rather than keeping a copy.
      # Written to GITHUB_ENV so the steps after this one check the same version.
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.package-version }}
        run: |
          version="${INPUT_VERSION:-$(dotnet msbuild src/TheBuilder.DeliveryApiOidc/TheBuilder.DeliveryApiOidc.csproj -getProperty:Version)}"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          # From the run rather than written out, so a renamed repository or a fork links to itself.
          RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag
        run: |
          arguments=(
            src/TheBuilder.DeliveryApiOidc/TheBuilder.DeliveryApiOidc.csproj
            -c Release
            -o artifacts
            "-p:Version=$PACKAGE_VERSION"
            -p:ContinuousIntegrationBuild=true
          )
          if [[ -n "$RELEASE_TAG" ]]; then
            arguments+=("-p:PackageReleaseNotes=$RELEASES_URL/$RELEASE_TAG")
          fi
          dotnet pack "${arguments[@]}"

      # What nuget.org and the Umbraco Marketplace need from the package, checked in the archive itself.
      - name: Validate package
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag
        run: |
          package="artifacts/TheBuilder.DeliveryApiOidc.$PACKAGE_VERSION.nupkg"
          unzip -t "$package"
          entries="$(unzip -Z1 "$package")"
          nuspec="$(unzip -p "$package" TheBuilder.DeliveryApiOidc.nuspec)"

          for entry in README.md LICENSE icon.png lib/net10.0/TheBuilder.DeliveryApiOidc.dll; do
            grep -Fqx "$entry" <<< "$entries" || { echo "The package is missing $entry." >&2; exit 1; }
          done
          grep -Fq "<version>$PACKAGE_VERSION</version>" <<< "$nuspec"
          # The Marketplace lists packages from nuget.org by this tag.
          grep -Fq "umbraco-marketplace" <<< "$nuspec"
          if [[ -n "$RELEASE_TAG" ]]; then
            grep -Fq "<releaseNotes>$RELEASES_URL/$RELEASE_TAG</releaseNotes>" <<< "$nuspec"
          fi

      # Restoring the package into a fresh site, with nuget.org as the only other source, is what an
      # installer does. It catches a dependency nuget.org does not have, which packing does not.
      - name: Install into a fresh project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/Consumer.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="TheBuilder.DeliveryApiOidc" Version="$PACKAGE_VERSION" /></ItemGroup>
          </Project>
          EOF
          dotnet restore "$RUNNER_TEMP/consumer/Consumer.csproj" \
            --source "$GITHUB_WORKSPACE/artifacts" --source https://api.nuget.org/v3/index.json

      # The publish workflow pushes this exact file, so what is published is what was checked.
      - uses: actions/upload-artifact@v4
        with:
          name: TheBuilder.DeliveryApiOidc-package
          path: artifacts/*.nupkg
          if-no-files-found: error
